[server]
# HuggingFace Spaces serves this app behind a reverse proxy (and sometimes in an
# iframe), which breaks Streamlit's XSRF cookie flow on the file-upload endpoint
# -> uploads fail with HTTP 403 and no backend traceback. This sandbox is a
# public demo with no auth or secrets, so XSRF protection can be safely disabled.
enableXsrfProtection = false
maxUploadSize = 200
# HF's reverse proxy strips the Sec-WebSocket-Extensions header, so Streamlit's
# permessage-deflate compression negotiation fails and the /_stcore/stream
# WebSocket drops + reconnects in a loop ("Connecting..." on every interaction).
# Disabling compression makes the WebSocket survive behind the proxy. enableCORS
# off is the standard reverse-proxy companion (safe: XSRF already off, no auth).
enableWebsocketCompression = false
enableCORS = false
# Disable the local-sources file watcher. It introspects torch.classes, which on
# torch>=2.6 raises a scary-but-harmless warning ("Examining the path of
# torch.classes raised...") on every script run. No files change at runtime in
# the deployed image, so hot-reload watching isn't needed.
fileWatcherType = "none"

# Light, polished palette. primaryColor (blue->indigo accent) styles native
# widgets (primary button, focus rings, dataframe progress columns) so they match
# the custom CSS injected in demo_app.py. Mirrors the HF Space card gradient
# (colorFrom: blue / colorTo: indigo).
[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fb"
textColor = "#1e293b"
font = "sans serif"
