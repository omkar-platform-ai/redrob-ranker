# Public repo. Full source, README with single reproduction command, Dockerfile,
# architecture diagram, and this metadata file at repo root.

sandbox_link: "https://omkars1986-redrob-ranker.hf.space/"
# Live HuggingFace Spaces (Docker SDK) Streamlit app. Accepts <=100 candidates,
# runs the full ranking pipeline end-to-end, and outputs a downloadable ranked
# CSV in <5 min on CPU. See submission_spec.md Section 10.5.

reproduce_command: "python rank.py --candidates ./candidates.jsonl --out ./submission.csv"
# Single command that produces submission.csv from candidates.jsonl. Runs CPU-only,
# no network, well within 5 min / 16 GB. Requires precompute.py to have built the
# FAISS index first (pre-computation is unconstrained per spec §3 / §10.3).

# ============================================================================
# Compute environment
# ============================================================================
compute:
  platform: "MacBook Pro (Apple M4 Pro)"        # dev machine that produced submission.csv
  cpu_cores: 14                                 # Apple M4 Pro (10 performance + 4 efficiency)
  ram_gb: 48                                    # rank step peaks at ~1.2 GB — ~13x under the 16 GB budget
  python_version: "3.11.9"
  os: "macOS"
  uses_gpu_for_inference: false                 # rank step is CPU-only (no GPU)
  has_network_during_ranking: false             # no API/network calls during ranking
  pre_computation_required: true                # embeds 100K candidates with bge-base into a FAISS IndexFlatIP
  pre_computation_time_minutes: 25              # ~20-25 min on MacBook CPU at default chunk-size 500 (per README)

# ============================================================================
# AI tools declaration
# ============================================================================
# Transparency only — declared use is NOT penalized. Stage 5 may verify these
# against the code.
ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Used Claude (Anthropic) for architecture design, code generation, debugging,
  and prompt engineering of the JD parser. No candidate data was fed to any
  hosted LLM during ranking — the ranking step is pure CPU math with no network.
  The only LLM call is at pre-compute time (Claude Haiku parses the JD into a
  structured ParsedJD). Candidate and JD embeddings use BAAI/bge-base-en-v1.5,
  an open-source sentence-transformer run locally.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Two-phase multi-signal ranker. Pre-compute (unconstrained): Claude Haiku parses
  the JD into a ParsedJD struct; BAAI/bge-base-en-v1.5 embeds 100K candidates into
  a FAISS IndexFlatIP. Rank step (<5 min, CPU-only, no LLM/network): load the index,
  embed the JD, ANN-retrieve the top-500, then score each candidate on five weighted
  signals — semantic similarity (40%), role-fit (20%), proficiency-weighted skill
  match (15%, blended with Redrob's measured assessment scores), behavioral signals
  (15%: recency, engagement, response rate, conversion, notice), and career
  trajectory (10%). Hard multipliers run before fusion: disqualifying title
  (HR/marketing) x0.10, consulting-only career x0.25, location-ineligible x0.50.
  A HoneypotDetector zeros profiles with 2+ consistency violations. Output is
  exactly 100 rows with data-grounded, template-based reasoning (no LLM at rank
  time, so no hallucinated skills). Deterministic tiebreak by candidate_id.

